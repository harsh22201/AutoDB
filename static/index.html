<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UniQuery — Interactive NL2SQL Demo</title>
    <meta
      name="description"
      content="UniQuery: An interactive natural language to SQL pipeline for querying structured and unstructured databases."
    />
    <link rel="stylesheet" href="/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- ===== CONNECT SCREEN ===== -->
    <div id="connect-screen" class="screen active">
      <div class="connect-container">
        <div class="logo">
          <div class="logo-icon">
            <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
              <rect width="48" height="48" rx="12" fill="url(#logo-grad)" />
              <path
                d="M14 16h20M14 24h20M14 32h12"
                stroke="white"
                stroke-width="2.5"
                stroke-linecap="round"
              />
              <circle
                cx="34"
                cy="32"
                r="6"
                fill="#fff"
                fill-opacity="0.2"
                stroke="white"
                stroke-width="2"
              />
              <path
                d="M32 32l2 2 3-3"
                stroke="white"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <defs>
                <linearGradient id="logo-grad" x1="0" y1="0" x2="48" y2="48">
                  <stop stop-color="#6366f1" />
                  <stop offset="1" stop-color="#8b5cf6" />
                </linearGradient>
              </defs>
            </svg>
          </div>
          <h1>UniQuery</h1>
          <p class="subtitle">Interactive NL2SQL Pipeline</p>
        </div>

        <div class="connect-form">
          <div class="form-row">
            <div class="form-group">
              <label for="db-name">Database Name</label>
              <input
                type="text"
                id="db-name"
                value="grocermind"
                placeholder="e.g. grocermind"
                autocomplete="off"
              />
            </div>
            <div class="form-group">
              <label for="db-password">Password</label>
              <input
                type="password"
                id="db-password"
                placeholder="••••••••"
                autocomplete="off"
              />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="db-host"
                >Host <span class="label-badge">Optional</span></label
              >
              <input
                type="text"
                id="db-host"
                placeholder="localhost"
                autocomplete="off"
              />
            </div>
            <div class="form-group">
              <label for="db-port"
                >Port <span class="label-badge">Optional</span></label
              >
              <input
                type="text"
                id="db-port"
                placeholder="5432"
                autocomplete="off"
              />
            </div>
            <div class="form-group">
              <label for="db-user"
                >User <span class="label-badge">Optional</span></label
              >
              <input
                type="text"
                id="db-user"
                placeholder="postgres"
                autocomplete="off"
              />
            </div>
          </div>

          <button id="connect-btn" class="btn-primary" onclick="connectDB()">
            <span class="btn-text">Connect</span>
            <span class="btn-loader" style="display: none"></span>
          </button>

          <div id="connect-error" class="error-msg" style="display: none"></div>
        </div>
      </div>
    </div>

    <!-- ===== MAIN SCREEN (Three-Panel) ===== -->
    <div id="main-screen" class="screen">
      <!-- Header -->
      <header class="app-header">
        <div class="header-left">
          <div class="header-logo">
            <svg width="28" height="28" viewBox="0 0 48 48" fill="none">
              <rect width="48" height="48" rx="12" fill="url(#logo-grad2)" />
              <path
                d="M14 16h20M14 24h20M14 32h12"
                stroke="white"
                stroke-width="2.5"
                stroke-linecap="round"
              />
              <defs>
                <linearGradient id="logo-grad2" x1="0" y1="0" x2="48" y2="48">
                  <stop stop-color="#6366f1" />
                  <stop offset="1" stop-color="#8b5cf6" />
                </linearGradient>
              </defs>
            </svg>
          </div>
          <span class="header-title">UniQuery</span>
          <span class="header-db" id="header-db-name"></span>
        </div>
        <div class="header-right">
          <button class="btn-ghost" onclick="disconnectDB()">Disconnect</button>
        </div>
      </header>

      <!-- Three Panel Layout -->
      <div class="panels-container">
        <!-- LEFT PANEL: Querying & Clarification -->
        <div class="panel panel-left">
          <div class="panel-label">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            Querying & Clarification
          </div>
          <div class="panel-body">
            <div class="query-input-wrap">
              <textarea
                id="query-input"
                rows="3"
                placeholder="Ask a question about your data in natural language..."
                autocomplete="off"
              ></textarea>
              <button id="submit-btn" class="btn-submit" onclick="submitQuery()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="22" y1="2" x2="11" y2="13" /><polygon points="22 2 15 22 11 13 2 9 22 2" />
                </svg>
              </button>
            </div>
            <div id="panel-left-steps" class="panel-steps">
              <!-- Step 1 card rendered here -->
            </div>
          </div>
        </div>

        <!-- MIDDLE PANEL: Automated Processing -->
        <div class="panel panel-middle">
          <div class="panel-label">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
            Automated Processing
          </div>
          <div class="panel-body" id="panel-middle-steps">
            <!-- Step 2, 3, 4 cards rendered here -->
            <div class="panel-placeholder" id="middle-placeholder">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
              <span>Submit a query to see analysis, retrieval, and decomposition</span>
            </div>
          </div>
        </div>

        <!-- RIGHT PANEL: Execution & Output -->
        <div class="panel panel-right">
          <div class="panel-label">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
            Execution & Output
            <button id="execute-btn" class="panel-execute-btn" onclick="runExecutionSteps()" disabled>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
              Execute
            </button>
          </div>
          <div class="panel-body" id="panel-right-steps">
            <!-- Step 5, 6 cards rendered here -->
            <div class="panel-placeholder" id="right-placeholder">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
              <span>SQL results and final answer will appear here</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
